<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chill Fetch — Video Downloader</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Ambient Canvas Background -->
  <canvas id="bgCanvas"></canvas>

  <!-- Ambient Blurred Orbs for Color Atmosphere -->
  <div class="bg-ambient">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <!-- Navigation -->
  <nav class="navbar">
    <div class="logo">
      <img src="Firefly_RemoveBackground.svg" alt="ChillFetch Logo" class="logo-img" />
      <span class="logo-text">ChillFetch</span>
    </div>
    <div class="nav-links">
      <a href="#supported">Platforms</a>
      <a href="#features">Features</a>
      <a href="#faq">FAQ</a>
    </div>
  </nav>

  <!-- Main Hero Section -->
  <main class="hero-container">
    <div class="card glass">
      
      <div class="badge">
        <span class="pulse-dot"></span> Fast & No Ads
      </div>

      <h1>Grab your favorite videos.<br><span class="gradient-text">Zero hassle.</span></h1>
      <p class="subtitle">Paste any video link below and download instantly in high quality.</p>

      <!-- Downloader Form -->
      <form class="download-form">
        <div class="input-group">
          <svg class="link-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
          </svg>
          <input type="url" placeholder="Paste link here (YouTube, TikTok, Instagram, etc.)" required />
          <button type="submit" class="btn-download">
            <span>Download</span>
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
          </button>
        </div>
      </form>

      <!-- Supported Tags -->
      <div class="supported-tags">
        <span>Supports:</span>
        <span class="tag">MP3</span>
        <span class="tag">MP4</span>
        <span class="tag">1080p</span>
        <span class="tag">60 FPS</span>
      </div>

    </div>
  </main>

  <!-- Clean Minimal Footer -->
  <footer class="footer">
    <p>© 2026 ChillFetch. Clean, simple, and fast downloads.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
